name: Daily Python Automation

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-python-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run Python tests
        run: python -m pytest tests/ -v

      - name: Generate daily Python activity
        run: python src/activity_logger.py

      - name: Commit generated activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily/activity.json
          if git diff --cached --quiet; then
            echo "No new daily record."
            exit 0
          fi
          git commit -m "chore: record daily Python automation"
          git push
